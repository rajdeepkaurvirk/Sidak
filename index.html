<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1929">
<meta name="description" content="Sidak & Alam — 11.11.27">
<title>Sidak & Alam — Until Forever</title>

<!-- One-file site: fonts load from Google when online; everything else is contained in this HTML. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --midnight-blue:#0a1929;
  --midnight-blue-light:#1a3a52;
  --midnight-blue-soft:#2d5a7a;
  --gold:#d1b56f;
  --gold-light:#f0d99a;
  --gold-dark:#8f7440;
  --pink:#efb8cb;
  --ivory:#f8f0df;
  --shadow:rgba(0,0,0,.42);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--midnight-blue);
}

body{
  color:var(--ivory);
  overflow-x:hidden;
  font-family:"Cormorant Garamond", Georgia, serif;
}

.page{
  position:relative;
  min-height:100svh;
  padding:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 25%, rgba(45,90,122,.12), transparent 32%),
    radial-gradient(circle at 50% 75%, rgba(0,0,0,.25), transparent 45%),
    var(--midnight-blue);
}

/* Subtle shimmer effect */
@keyframes shimmer {
  0% { background-position: -1000px 0; }
  100% { background-position: 1000px 0; }
}

/* Glitter animation */
@keyframes glitter {
  0%, 100% { opacity: 0.2; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1); }
}

/* Glitter particles */
.glitter {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.glitter-particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: radial-gradient(circle, rgba(240,217,154,1) 0%, rgba(240,217,154,0) 70%);
  border-radius: 50%;
  animation: glitter 2s ease-in-out infinite;
  box-shadow: 0 0 8px rgba(240,217,154,0.8);
}

.page::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(240, 217, 154, 0.03) 25%,
    rgba(240, 217, 154, 0.06) 50%,
    rgba(240, 217, 154, 0.03) 75%,
    transparent 100%
  );
  background-size: 1000px 100%;
  animation: shimmer 8s infinite linear;
  pointer-events: none;
  z-index: 1;
}

/* ---------- THICK VICTORIAN FRAME ---------- */

.frame{
  position:relative;
  z-index: 10;
  width:min(100%, 760px);
  min-height:calc(100svh - 36px);
  padding:42px 27px 34px;
  display:flex;
  justify-content:center;
  overflow:hidden;
  border:4px solid var(--gold);
  border-radius:7px;
  box-shadow:
    0 0 0 2px var(--midnight-blue),
    0 0 0 7px var(--gold-dark),
    0 0 0 9px var(--gold),
    inset 0 0 0 1px rgba(255,255,255,.25),
    inset 0 0 45px rgba(0,0,0,.28),
    0 18px 55px rgba(0,0,0,.38);
}

/* inner hairline */
.frame:before{
  content:"";
  position:absolute;
  inset:15px;
  border:1px solid rgba(240,217,154,.78);
  border-radius:3px;
  pointer-events:none;
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.15),
    0 0 16px rgba(209,181,111,.08);
}

/* very subtle old-paper grain */
.frame:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.07;
  background-image:
    radial-gradient(rgba(255,255,255,.9) .6px, transparent .7px),
    radial-gradient(rgba(0,0,0,.8) .6px, transparent .7px);
  background-size:13px 13px,17px 17px;
  background-position:0 0,6px 8px;
  mix-blend-mode:overlay;
}

/* ---------- GOLD STRING LIGHTS ---------- */

.string{
  position:absolute;
  z-index:2;
  pointer-events:none;
  height:45px;
  left:6%;
  right:6%;
  top:11px;
  border-top:2px solid rgba(209,181,111,.85);
  border-radius:50%;
  transform:rotate(-1.5deg);
  filter:drop-shadow(0 0 3px rgba(240,217,154,.25));
}

.string.bottom{
  top:auto;
  bottom:11px;
  transform:rotate(1.5deg);
}

.bulb{
  position:absolute;
  top:-4px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--gold-light);
  box-shadow:
    0 0 5px 2px rgba(240,217,154,.7),
    0 0 15px 4px rgba(240,217,154,.24);
  animation:twinkle 3.8s ease-in-out infinite;
}

.bulb:after{
  content:"";
  position:absolute;
  top:7px;
  left:3px;
  width:1px;
  height:8px;
  background:rgba(209,181,111,.8);
}

.b1{left:7%;animation-delay:.1s}.b2{left:18%;animation-delay:1.1s}
.b3{left:31%;animation-delay:2s}.b4{left:44%;animation-delay:.6s}
.b5{left:57%;animation-delay:2.5s}.b6{left:70%;animation-delay:1.6s}
.b7{left:83%;animation-delay:3s}.b8{left:94%;animation-delay:.9s}

@keyframes twinkle{
  0%,100%{opacity:.55;transform:scale(.82)}
  45%{opacity:1;transform:scale(1)}
  55%{opacity:.72}
}

/* ---------- CORNER ORNAMENTS ---------- */

.corner{
  position:absolute;
  width:88px;
  height:88px;
  z-index:3;
  pointer-events:none;
  opacity:.95;
}
.corner svg{width:100%;height:100%;fill:none;stroke:var(--gold);stroke-width:1.35}
.tl{top:18px;left:18px}
.tr{top:18px;right:18px;transform:scaleX(-1)}
.bl{bottom:18px;left:18px;transform:scaleY(-1)}
.br{bottom:18px;right:18px;transform:scale(-1)}

.content{
  position:relative;
  z-index:4;
  width:100%;
  max-width:620px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap: 12px;
}

/* ---------- MONOGRAM ---------- */

.monogram-wrap{
  margin-top:2px;
  margin-bottom:12px;
  width:140px;
  height:108px;
  position:relative;
  filter:drop-shadow(0 4px 7px rgba(0,0,0,.25));
  flex-shrink: 0;
}

.monogram-wrap svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.monogram-letter{
  fill:none;
  stroke:var(--gold-light);
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.monogram-ornament{
  fill:none;
  stroke:var(--gold);
  stroke-width:1.15;
  stroke-linecap:round;
}

.monogram-dot{fill:var(--gold-light)}

/* ---------- NAMES ---------- */

.names{
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  gap:14px;
  line-height:.8;
  margin:0;
  filter:drop-shadow(0 5px 8px rgba(0,0,0,.25));
  flex-shrink: 0;
  flex-wrap:wrap;
}

.name{
  font-family:"Ballet","Brush Script MT",cursive;
  font-size:clamp(4.7rem, 18vw, 8.5rem);
  font-weight:400;
  color:var(--pink);
  white-space:nowrap;
  letter-spacing:-.03em;
  margin: 0;
  line-height: 0.9;
}

.amp{
  font-family:"Cormorant Garamond",serif;
  color:var(--gold-light);
  font-size:1.15rem;
  line-height:1;
  margin:0;
  letter-spacing:.22em;
  order:2;
}

.name:first-child{order:1}
.name:last-child{order:3}

/* ---------- DATE ---------- */

.date{
  display:flex;
  align-items:center;
  gap:13px;
  color:var(--ivory);
  font-family:"Montserrat",Arial,sans-serif;
  font-size:.69rem;
  font-weight:500;
  letter-spacing:.48em;
  margin-left:.48em;
  margin:14px 0 16px;
  flex-shrink: 0;
}

.date:before,.date:after{
  content:"";
  width:34px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold));
}

.date:after{
  background:linear-gradient(90deg,var(--gold),transparent);
}

/* ---------- COUNTDOWN / POCKET WATCH ---------- */

.watch{
  position:relative;
  width:min(100%, 570px);
  margin:16px auto 0;
  padding:4px;
  border-radius:50%;
  background:
    linear-gradient(145deg, var(--gold-light), var(--gold-dark) 30%, var(--gold) 55%, #856a39);
  box-shadow:
    0 18px 30px rgba(0,0,0,.34),
    0 0 25px rgba(209,181,111,.12);
  flex-shrink: 0;
}

.watch-inner{
  position:relative;
  border:2px solid var(--midnight-blue-soft);
  border-radius:50%;
  padding:35px 25px 29px;
  background:
    radial-gradient(circle at 50% 38%, rgba(45,90,122,.2), transparent 43%),
    var(--midnight-blue);
  box-shadow:
    inset 0 0 0 2px rgba(240,217,154,.58),
    inset 0 0 38px rgba(0,0,0,.36);
}

/* small crown that makes the frame feel like a watch */
.watch-crown{
  position:absolute;
  top:-17px;
  left:50%;
  transform:translateX(-50%);
  width:48px;
  height:23px;
  border:2px solid var(--gold);
  border-bottom:0;
  border-radius:9px 9px 0 0;
  background:var(--midnight-blue);
  box-shadow:0 -3px 7px rgba(0,0,0,.25);
}

.watch-crown:before,
.watch-crown:after{
  content:"";
  position:absolute;
  top:5px;
  width:5px;
  height:12px;
  background:var(--gold);
}
.watch-crown:before{left:10px}
.watch-crown:after{right:10px}

.watch-title{
  color:var(--gold-light);
  font-family:"Montserrat",Arial,sans-serif;
  font-size:.57rem;
  letter-spacing:.46em;
  margin-left:.46em;
  margin-bottom:22px;
}

.countdown{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}

.unit{
  position:relative;
  padding:3px 2px 0;
}

.number{
  display:block;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(2.2rem,8.5vw,4rem);
  line-height:.9;
  font-weight:400;
  color:var(--ivory);
  text-shadow:0 3px 7px rgba(0,0,0,.4);
  font-variant-numeric:tabular-nums;
}

.label{
  display:block;
  margin-top:9px;
  color:var(--gold);
  font-family:"Montserrat",Arial,sans-serif;
  font-size:.48rem;
  letter-spacing:.25em;
  text-transform:uppercase;
}

.watch-rule{
  width:90px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:20px auto 0;
}

/* ---------- FOOTER ---------- */

.forever{
  color:var(--gold-light);
  font-family:"Montserrat",Arial,sans-serif;
  font-size:.58rem;
  letter-spacing:.62em;
  margin-left:.62em;
  margin-top:18px;
  flex-shrink: 0;
}

.spark{
  margin-top:10px;
  color:var(--pink);
  font-size:1rem;
  opacity:.88;
  letter-spacing:.45em;
  flex-shrink: 0;
}

/* ---------- MOBILE ---------- */

@media (max-width:520px){
  .page{padding:12px}

  .frame{
    min-height:calc(100svh - 24px);
    padding:42px 17px 31px;
    border-width:3px;
    box-shadow:
      0 0 0 2px var(--midnight-blue),
      0 0 0 5px var(--gold-dark),
      0 0 0 7px var(--gold),
      inset 0 0 35px rgba(0,0,0,.28),
      0 15px 35px rgba(0,0,0,.38);
  }

  .frame:before{inset:11px}

  .corner{width:68px;height:68px}
  .tl{top:15px;left:15px}
  .tr{top:15px;right:15px}
  .bl{bottom:15px;left:15px}
  .br{bottom:15px;right:15px}

  .monogram-wrap{
    width:118px;
    height:91px;
    margin-bottom:12px;
  }

  .content{gap:10px}

  .names{
    gap:10px;
    margin-bottom:0;
  }

  .name{
    font-size:clamp(4.25rem, 19vw, 6.2rem);
  }

  .date{
    font-size:.58rem;
    letter-spacing:.34em;
    margin-left:.34em;
    margin:12px 0 14px;
  }

  .date:before,.date:after{width:20px}

  .watch{
    width:100%;
    max-width:500px;
    margin: 14px auto 0;
  }

  .watch-inner{
    padding:29px 15px 24px;
  }

  .watch-title{
    font-size:.49rem;
    margin-bottom:17px;
  }

  .number{
    font-size:clamp(2rem, 9.5vw, 3rem);
  }

  .label{
    font-size:.41rem;
    letter-spacing:.18em;
  }

  .watch-rule{margin-top:16px;width:65px}

  .forever{font-size:.5rem;letter-spacing:.45em;margin-left:.45em;margin-top:14px}
  
  .spark{margin-top:8px}
}

@media (max-height:720px){
  .frame{padding-top:30px;padding-bottom:25px}
  .monogram-wrap{margin-bottom:10px}
  .content{gap:10px}
  .names{margin-bottom:0;gap:10px}
  .name{font-size:clamp(3.8rem,15vw,6.2rem)}
  .date{margin: 10px 0 12px}
  .watch{margin-top: 12px}
  .watch-inner{padding-top:24px;padding-bottom:20px}
  .watch-title{margin-bottom:12px}
  .watch-rule{margin-top:12px}
  .forever{margin-top: 12px}
  .spark{margin-top: 6px}
}

@media (prefers-reduced-motion:reduce){
  .bulb{animation:none}
  .page::before {animation: none}
  .glitter-particle{animation:none}
}
</style>
</head>

<body>
<main class="page">
  <!-- Glitter background -->
  <div class="glitter" aria-hidden="true"></div>

  <section class="frame" aria-label="Sidak and Alam wedding countdown">

    <div class="string" aria-hidden="true">
      <i class="bulb b1"></i><i class="bulb b2"></i><i class="bulb b3"></i><i class="bulb b4"></i>

    <div class="string bottom" aria-hidden="true">

    <div class="corner tl" aria-hidden="true">

        <path d="M21 5 C18 17 21 27 30 34 C38 40 48 40 57 35"/>

      </svg>

    <div class="corner bl" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <path d="M4 42 C18 11 38 4 70 4 C84 4 94 9 97 20"/>
        <path d="M4 60 C16 36 31 25 55 20 C72 17 84 20 91 29"/>
        <path d="M5 78 C17 57 30 46 44 40"/>

          <div class="countdown">

</main>

<script>
/*
  Wedding date:
  November 11, 2027.
  Vancouver is on Pacific Time. The browser automatically handles the
  viewer's local clock; the date below is fixed to Vancouver's PST offset.
*/
const weddingDate = new Date("2027-11-11T00:00:00-08:00");

const $ = id => document.getElementById(id);

function pad(value, length = 2) {
  return String(value).padStart(length, "0");
}

function updateCountdown() {
  const now = new Date();
  let diff = weddingDate.getTime() - now.getTime();

  if (diff <= 0) {
    $("days").textContent = "000";
    $("hours").textContent = "00";
    $("minutes").textContent = "00";
    $("seconds").textContent = "00";
    return;
  }

  const totalSeconds = Math.floor(diff / 1000);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  $("days").textContent = pad(days, 3);
  $("hours").textContent = pad(hours);
  $("minutes").textContent = pad(minutes);
  $("seconds").textContent = pad(seconds);
}

// Create glitter particles
function createGlitter() {
  const glitterContainer = document.querySelector('.glitter');
  const particleCount = 50;
  
  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.className = 'glitter-particle';
    
    const size = Math.random() * 3 + 2;
    particle.style.width = size + 'px';
    particle.style.height = size + 'px';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.top = Math.random() * 100 + '%';
    particle.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
    particle.style.animationDelay = Math.random() * 2 + 's';
    particle.style.opacity = Math.random() * 0.6 + 0.3;
    
    glitterContainer.appendChild(particle);
  }
}

createGlitter();
updateCountdown();
setInterval(updateCountdown, 1000);
</script>
