<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#091909" />
  <title>Sidak & Alam | Wedding Countdown</title>
  <style>
    :root{--forest:#091909;--forest-mid:#123017;--ivory:#f8ead7;--gold:#d8bd94;--pink:#efaeb8;--rose:#d9aaa4;--shadow:rgba(0,0,0,.46)}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{overflow:hidden;background:var(--forest);color:var(--ivory);font-family:Georgia,"Times New Roman",serif}
    .page{min-height:100svh;width:100%;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 44%,rgba(25,65,28,.83),rgba(4,15,4,.99) 73%),url("IMG_0509.jpeg") center/cover}.page::before{content:"";position:absolute;inset:-25%;z-index:0;pointer-events:none;opacity:.72;background:radial-gradient(circle at 15% 28%,rgba(239,174,184,.45),transparent 2%),radial-gradient(circle at 78% 20%,rgba(255,193,207,.34),transparent 2.5%),radial-gradient(circle at 34% 73%,rgba(239,174,184,.28),transparent 2%),radial-gradient(circle at 82% 78%,rgba(255,210,220,.34),transparent 2%),radial-gradient(circle at 52% 49%,rgba(239,174,184,.25),transparent 2%);filter:blur(1px);animation:shimmerDrift 9s ease-in-out infinite alternate}.page::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(90deg,rgba(2,10,2,.24),transparent 25%,transparent 75%,rgba(2,10,2,.24)),linear-gradient(rgba(239,174,184,.05),rgba(239,174,184,.02))}
    .stationery{width:min(100%,740px);min-height:100svh;position:relative;z-index:1;display:grid;place-items:center;padding:38px 30px 32px;border-left:1px solid rgba(216,189,148,.77);border-right:1px solid rgba(216,189,148,.77);background:linear-gradient(rgba(8,27,9,.31),rgba(8,27,9,.43)),url("IMG_0509.jpeg") center/cover;box-shadow:0 20px 48px var(--shadow),inset 0 0 0 1px rgba(216,189,148,.13);overflow:hidden}.stationery::before{content:"";position:absolute;inset:18px;border:1px solid rgba(216,189,148,.6);pointer-events:none}.stationery::after{content:"";position:absolute;inset:30px;border:1px solid rgba(239,174,184,.31);pointer-events:none}
    .string-lights{position:absolute;z-index:6;inset:0;pointer-events:none}.wire{position:absolute;opacity:.8}.wire.top,.wire.bottom{height:18px;left:19px;right:19px;border-top:1px solid rgba(216,189,148,.68)}.wire.top{top:15px;border-radius:0 0 50% 50%}.wire.bottom{bottom:15px;transform:rotate(180deg);border-radius:0 0 50% 50%}.wire.left,.wire.right{width:18px;top:19px;bottom:19px;border-left:1px solid rgba(216,189,148,.68)}.wire.left{left:15px;border-radius:0 50% 50% 0}.wire.right{right:15px;transform:rotate(180deg);border-radius:0 50% 50% 0}.bulb{position:absolute;width:8px;height:11px;border-radius:55% 55% 60% 60%;background:radial-gradient(circle at 38% 28%,#fff8d7 0 13%,#ffd477 35%,#c7812f 100%);border:1px solid rgba(255,239,180,.75);box-shadow:0 0 7px 3px rgba(255,201,102,.86),0 0 19px 6px rgba(255,178,95,.39);animation:glow 2.1s ease-in-out infinite}.bulb::before{content:"";position:absolute;top:-5px;left:1px;width:4px;height:4px;border-radius:1px;background:#8a6c47}.bulb.pink{background:radial-gradient(circle at 38% 28%,#fff0f4 0 13%,#ffb7c4 35%,#bd6778 100%);box-shadow:0 0 7px 3px rgba(255,175,194,.86),0 0 19px 6px rgba(239,132,155,.37)}
    .top .bulb:nth-child(1){left:5%;animation-delay:.1s}.top .bulb:nth-child(2){left:20%;animation-delay:1.1s}.top .bulb:nth-child(3){left:36%;animation-delay:.5s}.top .bulb:nth-child(4){left:52%;animation-delay:1.6s}.top .bulb:nth-child(5){left:68%;animation-delay:.8s}.top .bulb:nth-child(6){left:84%;animation-delay:1.35s}.top .bulb:nth-child(7){right:3%;animation-delay:.25s}.bottom .bulb:nth-child(1){left:5%;animation-delay:1.5s}.bottom .bulb:nth-child(2){left:20%;animation-delay:.7s}.bottom .bulb:nth-child(3){left:36%;animation-delay:1.9s}.bottom .bulb:nth-child(4){left:52%;animation-delay:.4s}.bottom .bulb:nth-child(5){left:68%;animation-delay:1.2s}.bottom .bulb:nth-child(6){left:84%;animation-delay:.15s}.bottom .bulb:nth-child(7){right:3%;animation-delay:1.65s}.left .bulb:nth-child(1){top:5%;animation-delay:.4s}.left .bulb:nth-child(2){top:20%;animation-delay:1.5s}.left .bulb:nth-child(3){top:36%;animation-delay:.8s}.left .bulb:nth-child(4){top:52%;animation-delay:1.8s}.left .bulb:nth-child(5){top:68%;animation-delay:.15s}.left .bulb:nth-child(6){top:84%;animation-delay:1.1s}.left .bulb:nth-child(7){bottom:3%;animation-delay:.65s}.right .bulb:nth-child(1){top:5%;animation-delay:1.25s}.right .bulb:nth-child(2){top:20%;animation-delay:.55s}.right .bulb:nth-child(3){top:36%;animation-delay:1.65s}.right .bulb:nth-child(4){top:52%;animation-delay:.25s}.right .bulb:nth-child(5){top:68%;animation-delay:1.35s}.right .bulb:nth-child(6){top:84%;animation-delay:.85s}.right .bulb:nth-child(7){bottom:3%;animation-delay:1.95s}
    .pink-shimmer{position:absolute;z-index:2;inset:30px;pointer-events:none;overflow:hidden}.shimmer{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffc7d0;box-shadow:0 0 8px 3px rgba(255,174,192,.82),0 0 20px 6px rgba(239,174,184,.4);animation:softShimmer 3.5s ease-in-out infinite}.shimmer:nth-child(1){top:17%;left:20%;animation-delay:.2s}.shimmer:nth-child(2){top:24%;right:16%;animation-delay:1.6s}.shimmer:nth-child(3){top:44%;left:12%;animation-delay:2.4s}.shimmer:nth-child(4){top:54%;right:13%;animation-delay:.9s}.shimmer:nth-child(5){bottom:18%;left:22%;animation-delay:1.8s}.shimmer:nth-child(6){bottom:26%;right:20%;animation-delay:.4s}.shimmer:nth-child(7){top:9%;left:55%;animation-delay:2.7s}.shimmer:nth-child(8){bottom:8%;left:49%;animation-delay:1.15s}
    .content{position:relative;z-index:4;width:100%;max-width:600px;text-align:center}.monogram{width:min(62vw,350px);height:min(71vw,410px);min-width:235px;min-height:280px;margin:0 auto 28px;position:relative;display:grid;place-items:center;color:var(--ivory);filter:drop-shadow(0 0 5px rgba(216,189,148,.4))}.monogram::before{content:"";position:absolute;inset:8%;border:3px solid var(--gold);border-radius:47% 47% 44% 44%/34% 34% 42% 42%;box-shadow:0 0 0 4px rgba(9,25,9,.75),0 0 0 5px rgba(216,189,148,.72)}.monogram::after{content:"❦";position:absolute;top:-4%;left:50%;transform:translateX(-50%);color:var(--gold);font-size:4.7rem;text-shadow:0 0 6px rgba(216,189,148,.4)}.ornament{position:absolute;color:var(--gold);font-size:4rem;line-height:1;text-shadow:0 0 6px rgba(216,189,148,.4)}.ornament.left{left:0;top:37%;transform:rotate(-84deg)}.ornament.right{right:0;top:37%;transform:rotate(84deg)}.ornament.bottom{bottom:-7%;left:50%;transform:translateX(-50%) rotate(180deg);font-size:3.7rem}.initials{position:relative;z-index:2;font-size:clamp(8.2rem,32vw,13.8rem);line-height:.7;font-style:italic;font-weight:normal;letter-spacing:-.27em;margin-left:-.1em;color:var(--ivory);text-shadow:0 0 11px rgba(216,189,148,.26)}.initials span:first-child{position:relative;z-index:2}.initials span:last-child{position:relative;z-index:1;margin-left:-.23em}.names{margin:0;color:var(--ivory);font-size:clamp(2rem,7vw,3.7rem);font-weight:normal;line-height:1;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 2px 5px #000}.date{margin:19px 0 23px;color:var(--gold);letter-spacing:.25em;text-transform:uppercase;font:600 clamp(.68rem,2.4vw,.83rem) Arial,sans-serif}.divider{display:flex;align-items:center;gap:10px;width:210px;margin:0 auto 18px;color:var(--gold)}.divider::before,.divider::after{content:"";height:1px;flex:1;background:var(--gold)}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:440px;margin:auto}.unit{min-width:0}.number{display:block;color:var(--ivory);font:300 clamp(1.3rem,5.3vw,2rem) Arial,sans-serif;letter-spacing:.03em;text-shadow:0 2px 5px #000}.label{display:block;margin-top:7px;color:var(--rose);font:600 .5rem Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
    @keyframes glow{0%,100%{opacity:.38;transform:scale(.76)}50%{opacity:1;transform:scale(1.22)}}@keyframes softShimmer{0%,100%{opacity:.1;transform:scale(.55)}50%{opacity:.9;transform:scale(1.8)}}@keyframes shimmerDrift{0%{transform:translate(-1%,-1%) scale(1)}100%{transform:translate(2%,2%) scale(1.04)}}@media(max-width:420px){.stationery{padding:32px 25px 28px}.monogram{margin-bottom:23px}.names{font-size:1.92rem}.date{margin:16px 0 20px}.string-lights .wire.top{top:12px}.string-lights .wire.bottom{bottom:12px}.wire.left{left:12px}.wire.right{right:12px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
  </style>
</head>
<body>
  <main class="page">
    <section class="stationery" aria-label="Sidak and Alam wedding countdown">
      <div class="pink-shimmer" aria-hidden="true"><i class="shimmer"></i><i class="shimmer"></i><i class="shimmer"></i><i class="shimmer"></i><i class="shimmer"></i><i class="shimmer"></i><i class="shimmer"></i><i class="shimmer"></i></div>
      <div class="string-lights" aria-hidden="true">
        <div class="wire top"><i class="bulb"></i><i class="bulb pink"></i><i class="bulb"></i><i class="bulb pink"></i><i class="bulb"></i><i class="bulb pink"></i><i class="bulb"></i></div>
        <div class="wire right"><i class="bulb pink"></i><i class="bulb"></i><i class="bulb pink"></i><i class="bulb"></i><i class="bulb pink"></i><i class="bulb"></i><i class="bulb pink"></i></div>
        <div class="wire bottom"><i class="bulb"></i><i class="bulb pink"></i><i class="bulb"></i><i class="bulb pink"></i><i class="bulb"></i><i class="bulb pink"></i><i class="bulb"></i></div>
        <div class="wire left"><i class="bulb pink"></i><i class="bulb"></i><i class="bulb pink"></i><i class="bulb"></i><i class="bulb pink"></i><i class="bulb"></i><i class="bulb pink"></i></div>
      </div>
      <div class="content">
        <div class="monogram" aria-label="S and A monogram"><span class="ornament left">❧</span><span class="ornament right">❧</span><span class="ornament bottom">❦</span><div class="initials"><span>S</span><span>A</span></div></div>
        <h1 class="names">Sidak &amp; Alam</h1>
        <p class="date">November 11, 2027</p>
        <div class="divider" aria-hidden="true">✦</div>
        <div class="countdown" aria-live="polite">
          <div class="unit"><span class="number" id="days">000</span><span class="label">Days</span></div>
          <div class="unit"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
          <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
          <div class="unit"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const target=new Date('November 11, 2027 00:00:00').getTime();
    const pad=(value,digits)=>String(value).padStart(digits,'0');
    function update(){const left=target-Date.now();if(left<=0){days.textContent='000';hours.textContent=minutes.textContent=seconds.textContent='00';return}days.textContent=pad(Math.floor(left/86400000),3);hours.textContent=pad(Math.floor(left%86400000/3600000),2);minutes.textContent=pad(Math.floor(left%3600000/60000),2);seconds.textContent=pad(Math.floor(left%60000/1000),2)}
    update();setInterval(update,1000);
  </script>
</body>
</html>
