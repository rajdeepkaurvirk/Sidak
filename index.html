<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidak &amp; Alam</title>
<meta name="theme-color" content="#f2cdd0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>
<main class="stage">
<svg viewBox="0 0 736 1312" preserveAspectRatio="none" aria-hidden="true">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9e7b4"/><stop offset=".35" stop-color="#f6d3c8"/><stop offset=".7" stop-color="#f4c8cc"/><stop offset="1" stop-color="#e9aeb8"/></linearGradient>
  <radialGradient id="pan" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#fff6d2"/><stop offset=".55" stop-color="#fbe4d6"/><stop offset="1" stop-color="#f3c4ca"/></radialGradient>
  <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b8" stop-opacity=".85"/><stop offset="1" stop-color="#fff3b8" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#fff2b8" stop-opacity=".9"/><stop offset="1" stop-color="#ffe2b8" stop-opacity="0"/></radialGradient>
  <radialGradient id="vig" cx="50%" cy="46%" r="72%"><stop offset=".6" stop-color="#b8646f" stop-opacity="0"/><stop offset="1" stop-color="#9a4a5a" stop-opacity=".38"/></radialGradient>
  <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa07a" stop-opacity="0"/><stop offset=".75" stop-color="#7a8c68" stop-opacity=".85"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="paint" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="2"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .4  0 0 0 0 .35  0 0 0 .5 -.15"/></filter>
</defs>
<rect width="736" height="1312" fill="url(#bg)"/>
<g id="far" filter="url(#blur)" opacity=".7"></g>
<g id="bush" filter="url(#paint)"></g>
<g id="bush" filter="url(#paint)"></g>
<path d="M180 1312V530C180 350 262 208 368 100C474 208 556 350 556 530V1312Z" fill="url(#pan)"/>
<circle cx="368" cy="300" r="150" fill="url(#glow)"/>
<circle cx="368" cy="300" r="44" fill="#fff4c2"/><circle cx="352" cy="288" r="9" fill="#f3d6d2" opacity=".6"/><circle cx="380" cy="314" r="6" fill="#f3d6d2" opacity=".6"/>
<g id="rays" fill="url(#ray)" style="mix-blend-mode:screen"></g>
<g id="stones"></g>
<path id="arch" d="M180 1312V530C180 350 262 208 368 100C474 208 556 350 556 530V1312" fill="none"/>
<g fill="none"><use href="#arch" stroke="#c79a4e" stroke-width="16"/><use href="#arch" stroke="#f4dc9c" stroke-width="8"/><use href="#arch" stroke="#fff6d6" stroke-width="1.8"/></g>
<path d="M368 100V54M361 66l7-16 7 16z" stroke="#e3c48f" stroke-width="2" fill="#f4dc9c"/>
<g id="beads"></g>
<g id="vine" filter="url(#paint)"></g>
<g id="lant"></g>
<rect y="1120" width="736" height="192" fill="url(#gr)"/>
<g id="ground" filter="url(#paint)"></g>
<g id="lights"></g>
<rect width="736" height="1312" fill="url(#vig)"/>
<rect width="736" height="1312" filter="url(#paper)" opacity=".4" style="mix-blend-mode:multiply"/>
</svg>
<canvas id="glitter" aria-hidden="true"></canvas>

<div class="names">Sidak &amp; Alam</div>
<div class="count" role="timer" aria-label="Time until the wedding">
  <div><span class="n" id="d">000</span><span class="l">days</span></div>
  <div><span class="n" id="h">00</span><span class="l">hours</span></div>
  <div><span class="n" id="m">00</span><span class="l">minutes</span></div>
  <div><span class="n" id="s">00</span><span class="l">seconds</span></div>
</div>
<div class="date">11 November 2027</div>
<div class="sheen"></div>
</main>

<script src="script.js"></script>
</body>
</html>
