*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#0f1a0c}.stage{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:max(100vw,56.1dvh);height:max(100dvh,178.3vw);container-type:size;overflow:hidden}@media(min-aspect-ratio:3/4){.stage{width:56.1dvh;height:100dvh}}
.stage>svg,#glit{position:absolute;inset:0;width:100%;height:100%;display:block}#glit{pointer-events:none}.names,.date,.count{position:absolute;left:50%;transform:translateX(-50%);text-align:center}.names{top:37.4%;white-space:nowrap;font:400 11cqw/1.2 "Pinyon Script","Snell Roundhand",cursive;color:transparent;background:linear-gradient(108deg,#6b4713,#d7a843 10%,#fff0a8 21%,#e5b94f 31%,#fff8d7 41%,#b77d20 52%,#ffe995 62%,#d5a43b 72%,#fff5c4 82%,#8c5e19 90%,#6b4713) 0 0/220% 100%;-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.8)) drop-shadow(0 0 12px rgba(255,212,110,.4));animation:sh 5s ease-in-out infinite alternate}@keyframes sh{to{background-position:100% 0}}
.count{top:45.4%;width:72cqw;display:grid;grid-template-columns:repeat(4,1fr);padding:4.6cqw 1cqw 3.4cqw;border:1.5px solid #d9c27a;border-radius:3.2cqw;background:rgba(6,16,8,.5);box-shadow:inset 0 0 0 1.3cqw rgba(22,40,24,.92),inset 0 0 0 calc(1.3cqw + 1px) rgba(217,194,122,.7),0 0 14px rgba(217,194,122,.18)}.count div+div{border-left:1px solid rgba(217,194,122,.4)}.n{display:block;font:700 8.6cqw/1 "Playfair Display",serif;color:#efe0a8;text-shadow:0 1px 2px rgba(0,0,0,.55);font-variant-numeric:lining-nums tabular-nums}.l{display:block;margin-top:1.2cqw;font:400 4.6cqw/1 "Italianno","Pinyon Script",cursive;color:#d9c98e}.count:before,.count:after{content:"◆";position:absolute;left:50%;transform:translateX(-50%);font-size:3.2cqw;color:#dfc98b;background:#16281a;padding:0 1.6cqw}.count:before{top:-1.9cqw}.count:after{bottom:-1.9cqw}
.date{top:59.6%;width:82cqw;color:#f4e8c5;text-shadow:0 1px 2px rgba(0,0,0,.65)}.date-main{display:block;font:700 12.8cqw/.95 "Playfair Display",Georgia,serif;letter-spacing:.13em;color:#fff0ad;text-shadow:0 0 7px rgba(255,215,120,.55),0 2px 3px rgba(0,0,0,.7);animation:dateGlow 3.8s ease-in-out infinite}@keyframes dateGlow{50%{text-shadow:0 0 18px rgba(255,220,125,.9),0 2px 3px rgba(0,0,0,.7)}}.date-divider{display:block;width:38cqw;height:2px;margin:2.3cqw auto 1.8cqw;background:linear-gradient(90deg,transparent,#c28b2b 18%,#fff4bf 50%,#c28b2b 82%,transparent);box-shadow:0 0 10px rgba(246,215,126,.75)}.date-year{display:block;font:italic 500 4.1cqw/1 "Playfair Display",Georgia,serif;letter-spacing:.24em;text-transform:uppercase;color:#e4cf91}
.sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(115deg,transparent 32%,rgba(255,235,170,.8) 46%,rgba(255,248,220,.98) 50%,rgba(255,211,120,.75) 54%,rgba(255,239,180,.6) 58%,transparent 68%) 0 0/240% 100%;animation:sw 6s linear infinite}@keyframes sw{from{background-position:130% 0}to{background-position:-30% 0}}@media(prefers-reduced-motion:reduce){.names,.date-main,.sheen{animation:none}}
</style>
</head>

<script>
const $=id=>document.getElementById(id),wedding=new Date("2027-11-11T00:00:00"),cv=$("glit"),ctx=cv.getContext("2d"),reduced=matchMedia("(prefers-reduced-motion:reduce)").matches;let W,H,dpr=1,last=0;const r=seed=>()=>{seed=seed*16807%2147483647;return seed/2147483647};const rand=r(42),sparkles=[];function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}for(let i=0;i<250;i++)sparkles.push({x:rand(),y:rand(),size:1+rand()*3.5,phase:rand()*Math.PI*2,speed:.7+rand()*2.4,twinkle:rand()>.65});function frame(ms){const t=ms/1000,dt=Math.min(t-last,.1);last=t;ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation="lighter";sparkles.forEach(p=>{if(!reduced&&p.twinkle)p.y-=dt*.003;if(p.y<-.02)p.y=1.02;const pulse=.25+.75*(.5+.5*Math.sin(t*p.speed+p.phase)),x=p.x*W,y=p.y*H,s=p.size*(.65+1.1*pulse);ctx.globalAlpha=p.twinkle?.15+.85*pulse:.25;ctx.fillStyle="#ffe9a6";ctx.shadowBlur=7*pulse;ctx.shadowColor="#ffd66d";ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();if(p.twinkle&&pulse>.86){ctx.globalAlpha=.65*pulse;ctx.fillRect(x-s*3,y-.45,x+s*3,.9);ctx.fillRect(x-.45,y-s*3,.9,y+s*3)}});ctx.shadowBlur=0;ctx.globalAlpha=1;if(!reduced)requestAnimationFrame(frame)}function tick(){const t=Math.max(0,Math.floor((wedding-new Date())/1000));$("d").textContent=String(Math.floor(t/86400)).padStart(3,"0");$("h").textContent=String(Math.floor(t%86400/3600)).padStart(2,"0");$("m").textContent=String(Math.floor(t%3600/60)).padStart(2,"0");$("s").textContent=String(t%60).padStart(2,"0")}size();addEventListener("resize",size);requestAnimationFrame(frame);tick();setInterval(tick,1000);
</script></body></html>
