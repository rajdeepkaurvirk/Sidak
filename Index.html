<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidak & Alam</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Playfair+Display:wght@500;700&family=Pinyon+Script&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
  overflow: hidden;
  background: #0f1a0c;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Playfair Display", serif;
}

.stage {
  position: relative;
  width: min(100vw, 560px);
  height: 100vh;
  min-height: 650px;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 20%, #29462b 0%, transparent 35%),
    linear-gradient(180deg, #1d3421, #101f12);
  color: #f4e8c5;
}

.stage::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.18;
  pointer-events: none;
  background-image:
    radial-gradient(#d8c894 0.6px, transparent 0.6px);
  background-size: 8px 8px;
  mix-blend-mode: overlay;
}

.monogram {
  position: absolute;
  top: 12%;
  left: 50%;
  transform: translateX(-50%);
  color: #e7d495;
  font-family: "Pinyon Script", cursive;
  font-size: clamp(90px, 27vw, 150px);
  line-height: 1;
  text-shadow:
    0 0 8px rgba(235, 211, 142, 0.45),
    0 3px 4px rgba(0, 0, 0, 0.5);
  z-index: 2;
}

.monogram span {
  margin-left: -25px;
  font-size: 0.85em;
}

.filigree {
  position: absolute;
  left: 50%;
  top: 25%;
  width: 76%;
  height: 16%;
  transform: translateX(-50%);
  border-top: 1px solid rgba(232, 211, 151, 0.8);
  border-bottom: 1px solid rgba(232, 211, 151, 0.8);
  border-radius: 50%;
  opacity: 0.75;
}

.filigree::before,
.filigree::after {
  content: "❧";
  position: absolute;
  top: 50%;
  color: #e5ce91;
  font-size: 35px;
  transform: translateY(-50%);
}

.filigree::before {
  left: -28px;
}

.filigree::after {
  right: -28px;
  transform: translateY(-50%) scaleX(-1);
}

.names {
  position: absolute;
  top: 37%;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  color: #f1dfaa;
  font-family: "Pinyon Script", cursive;
  font-size: clamp(44px, 12vw, 70px);
  text-shadow: 0 2px 3px rgba(0, 0, 0, 0.7);
  z-index: 3;
}

.countdown {
  position: absolute;
  top: 48%;
  left: 50%;
  width: 82%;
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 25px 10px 20px;
  border: 1px solid #d9c27a;
  border-radius: 18px;
  background: rgba(6, 16, 8, 0.48);
  box-shadow:
    inset 0 0 0 7px rgba(22, 40, 24, 0.9),
    inset 0 0 0 8px rgba(217, 194, 122, 0.65),
    0 0 18px rgba(217, 194, 122, 0.2);
  z-index: 3;
}

.countdown::before,
.countdown::after {
  content: "◆";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  padding: 0 12px;
  color: #dfc98b;
  background: #16281a;
  font-size: 17px;
}

.countdown::before {
  top: -11px;
}

.countdown::after {
  bottom: -11px;
}

.time {
  text-align: center;
}

.time + .time {
  border-left: 1px solid rgba(217, 194, 122, 0.4);
}

.number {
  display: block;
  color: #efe0a8;
  font-size: clamp(27px, 8vw, 44px);
  font-weight: 700;
  line-height: 1;
}

.label {
  display: block;
  margin-top: 8px;
  color: #d9c98e;
  font-family: "Italianno", cursive;
  font-size: clamp(22px, 5vw, 30px);
}

.date {
  position: absolute;
  top: 67%;
  left: 50%;
  width: 85%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 3;
}

.date-main {
  display: block;
  color: #f4e8c5;
  font-size: clamp(34px, 9vw, 52px);
  letter-spacing: 0.12em;
}

.divider {
  display: block;
  width: 180px;
  height: 1px;
  margin: 18px auto;
  background: linear-gradient(
    to right,
    transparent,
    #d8c27a,
    #d8aaa2,
    #d8c27a,
    transparent
  );
}

.date-year {
  color: #d8c894;
  font-size: clamp(14px, 4vw, 20px);
  font-style: italic;
  letter-spacing: 0.25em;
  text-transform: uppercase;
}

.flower {
  position: absolute;
  bottom: -30px;
  color: #eaded0;
  font-size: 130px;
  line-height: 1;
  opacity: 0.9;
  filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.5));
}

.flower.left {
  left: -22px;
  transform: rotate(-18deg);
}

.flower.right {
  right: -22px;
  transform: rotate(18deg) scaleX(-1);
  color: #e0c5c0;
}

.sparkle {
  position: absolute;
  color: #f7e7aa;
  font-size: 13px;
  animation: twinkle 2.5s ease-in-out infinite alternate;
}

.sparkle.one {
  top: 20%;
  left: 18%;
}

.sparkle.two {
  top: 31%;
  right: 16%;
  animation-delay: 0.8s;
}

.sparkle.three {
  top: 57%;
  left: 12%;
  animation-delay: 1.4s;
}

.sparkle.four {
  top: 59%;
  right: 12%;
  animation-delay: 1.9s;
}

@keyframes twinkle {
  from {
    opacity: 0.2;
    transform: scale(0.7) rotate(0deg);
  }

  to {
    opacity: 1;
    transform: scale(1.3) rotate(45deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .sparkle {
    animation: none;
  }
}
</style>
</head>

<body>
<main class="stage">
  <div class="monogram">S<span>A</span></div>

  <div class="filigree"></div>

  <div class="names">Sidak &amp; Alam</div>

  <section class="countdown" aria-label="Time until the wedding">
    <div class="time">
      <span class="number" id="days">000</span>
      <span class="label">Days</span>
    </div>

    <div class="time">
      <span class="number" id="hours">00</span>
      <span class="label">Hours</span>
    </div>

    <div class="time">
      <span class="number" id="minutes">00</span>
      <span class="label">Minutes</span>
    </div>

    <div class="time">
      <span class="number" id="seconds">00</span>
      <span class="label">Seconds</span>
    </div>
  </section>

  <section class="date">
    <span class="date-main">11 / 11</span>
    <span class="divider"></span>
    <span class="date-year">November · 2027</span>
  </section>

  <div class="flower left">❀</div>
  <div class="flower right">❀</div>

  <span class="sparkle one">✦</span>
  <span class="sparkle two">✧</span>
  <span class="sparkle three">✦</span>
  <span class="sparkle four">✧</span>
</main>

<script>
const weddingDate = new Date("2027-11-11T00:00:00");

function pad(number, length) {
  return String(number).padStart(length, "0");
}

function updateCountdown() {
  const now = new Date();
  const difference = Math.max(
    0,
    weddingDate.getTime() - now.getTime()
  );

  const totalSeconds = Math.floor(difference / 1000);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  document.getElementById("days").textContent = pad(days, 3);
  document.getElementById("hours").textContent = pad(hours, 2);
  document.getElementById("minutes").textContent = pad(minutes, 2);
  document.getElementById("seconds").textContent = pad(seconds, 2);
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
