<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--navy)}body{color:var(--ivory);font-family:"Cormorant Garamond",Georgia,serif}.page{min-height:100svh;padding:18px;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#1a3a5220,transparent 35%),var(--navy)}

.monogram-wrap{width:164px;height:132px;margin:0 0 8px;filter:drop-shadow(0 5px 7px #00000055)}.monogram-wrap svg{width:100%;height:100%;overflow:visible}.mono-rule{fill:none;stroke:var(--gold);stroke-width:1.15;stroke-linecap:round}.mono-fine{fill:none;stroke:var(--light);stroke-width:.8}.mono-letter{fill:none;stroke:var(--light);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.mono-fill{fill:var(--light)}

.watch{position:relative;width:min(100%,570px);margin:16px auto 0;padding:4px;border-radius:50%;background:linear-gradient(145deg,var(--light),var(--dark) 30%,var(--gold) 55%,#856a39);box-shadow:0 18px 30px #00000058,0 0 25px #d1b56f1f}.watch-inner{position:relative;border:2px solid #2d5a7a;border-radius:50%;padding:35px 25px 29px;background:radial-gradient(circle at 50% 38%,#2d5a7a33,transparent 43%),var(--navy);box-shadow:inset 0 0 0 2px #f0d99a94,inset 0 0 38px #0000005c}.watch-crown{position:absolute;top:-17px;left:50%;transform:translateX(-50%);width:48px;height:23px;border:2px solid var(--gold);border-bottom:0;border-radius:9px 9px 0 0;background:var(--navy)}.watch-crown:before,.watch-crown:after{content:"";position:absolute;top:5px;width:5px;height:12px;background:var(--gold)}.watch-crown:before{left:10px}.watch-crown:after{right:10px}.watch-title,.forever{font-family:Montserrat,Arial,sans-serif;color:var(--light);font-size:.57rem;letter-spacing:.46em;margin-left:.46em}.watch-title{margin-bottom:22px}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.number{display:block;font-size:clamp(2.2rem,8.5vw,4rem);line-height:.9;font-weight:400;font-variant-numeric:tabular-nums;text-shadow:0 3px 7px #0006}.label{display:block;margin-top:9px;color:var(--gold);font-family:Montserrat,Arial,sans-serif;font-size:.48rem;letter-spacing:.25em;text-transform:uppercase}.watch-rule{width:90px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px auto 0}.forever{margin-top:18px}.spark{margin-top:10px;color:var(--pink);letter-spacing:.45em}
@media(max-width:520px){.page{padding:12px}.frame{min-height:calc(100svh - 24px);padding:47px 17px 31px;border-width:3px;box-shadow:0 0 0 2px var(--navy),0 0 0 5px var(--dark),0 0 0 7px var(--gold),inset 0 0 35px #00000048,0 15px 35px #00000060}.frame:before{inset:11px}.corner{width:68px;height:68px}.tl{top:15px;left:15px}.tr{top:15px;right:15px}.bl{bottom:15px;left:15px}.br{bottom:15px;right:15px}.monogram-wrap{width:136px;height:110px;margin-bottom:4px}.names{gap:10px}.name{font-size:clamp(4.25rem,19vw,6.2rem)}.date{font-size:.58rem;letter-spacing:.34em;margin-left:.34em;margin:12px 0 14px}.date:before,.date:after{width:20px}.watch{width:100%;margin:14px auto 0}.watch-inner{padding:29px 15px 24px}.watch-title{font-size:.49rem;margin-bottom:17px}.number{font-size:clamp(2rem,9.5vw,3rem)}.label{font-size:.41rem;letter-spacing:.18em}.watch-rule{margin-top:16px;width:65px}.forever{font-size:.5rem;letter-spacing:.45em;margin-left:.45em;margin-top:14px}}
</style>
