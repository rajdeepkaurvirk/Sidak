.page::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -4;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 45%, rgba(255,255,255,.12), transparent 48%),
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,248,241,.14));
}

.glow {
  position: fixed;
  z-index: -2;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #fff3b9;
  box-shadow:
    0 0 8px #fff4bf,
    0 0 18px rgba(246,216,126,.95),
    0 0 36px rgba(232,190,78,.42);
  opacity: .9;
  animation: twinkle 3.2s ease-in-out infinite;
  pointer-events: none;
}

.g1 { top: 7%; left: 7%; animation-delay: -.5s; transform: scale(.45); }
.g2 { top: 14%; right: 8%; animation-delay: -2s; transform: scale(.7); }
.g3 { top: 29%; left: 4%; animation-delay: -1.1s; transform: scale(.36); }
.g4 { top: 39%; right: 5%; animation-delay: -2.6s; transform: scale(.55); }
.g5 { bottom: 27%; left: 8%; animation-delay: -.9s; transform: scale(.6); }
.g6 { bottom: 15%; right: 9%; animation-delay: -1.8s; transform: scale(.4); }
.g7 { bottom: 6%; left: 44%; animation-delay: -2.8s; transform: scale(.72); }
.g8 { top: 50%; left: 50%; animation-delay: -1.5s; transform: scale(.25); }

@keyframes twinkle {
  0%,100% { opacity:.35; filter: blur(.2px); }
  50% { opacity:1; filter: blur(0); }
}

.content {
  width: min(100%, 650px);
  text-align: center;
  padding: 8px 0 4px;
}

.seal {
  position: relative;
  width: 92px;
  height: 92px;
  margin: 0 auto 11px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff9ef;
  background:
    radial-gradient(circle at 35% 30%, #d79aaa 0 8%, transparent 9%),
    radial-gradient(circle at 50% 48%, #bf788b 0, #a85f74 58%, #965367 100%);
  border: 2px solid rgba(255,244,220,.88);
  box-shadow:
    0 4px 10px rgba(115,70,62,.18),
    inset 0 0 0 4px rgba(255,255,255,.16),
    inset 0 0 0 7px rgba(121,62,78,.13),
    0 0 0 3px rgba(214,174,91,.75);
  transform: rotate(-2deg);
}

.seal::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px dashed rgba(255,247,226,.72);
  border-radius: 50%;
}

.seal::after {
  content: "S  ·  A";
  position: absolute;
  inset: -7px;
  border-radius: 50%;
  border: 1px solid rgba(211,171,89,.7);
  opacity: .8;
}

.monogram {
  position: relative;
  z-index: 1;
  font-family: "DM Serif Display", Georgia, serif;
  font-size: 37px;
  line-height: 1;
  letter-spacing: -4px;
  transform: translateX(-2px);
  text-shadow: 0 1px 2px rgba(100,50,55,.2);
}

.kicker {
  margin: 0 0 2px;
  text-transform: uppercase;
  letter-spacing: .34em;
  font-size: 11px;
  font-weight: 600;
  color: var(--gold);
}

.names {
  margin: 0;
  color: var(--blush);
  font-family: "Allura", "Brush Script MT", cursive;
  font-size: clamp(55px, 15vw, 91px);
  line-height: .86;
  font-weight: 400;
  text-shadow: 0 2px 8px rgba(255,255,255,.8);
}

.amp {
  font-family: "DM Serif Display", Georgia, serif;
  font-style: italic;
  font-size: .45em;
  vertical-align: .14em;
  margin: 0 .08em;
  color: var(--gold);
}

.until {
  margin: 11px 0 16px;
  font-family: "Allura", cursive;
  font-size: clamp(29px, 8vw, 44px);
  line-height: 1;
  color: var(--blush-deep);
}

.date {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 0 auto 17px;
  color: var(--gold);
  font-size: 13px;
  letter-spacing: .24em;
  font-weight: 600;
}

.date::before,
.date::after {
  content: "";
  width: 30px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold));
}
.date::after { background: linear-gradient(90deg, var(--gold), transparent); }

.score-frame {
  position: relative;
  padding: 19px 12px 16px;
  border: 1px solid rgba(188,146,65,.78);
  background: rgba(255,252,247,.28);
  box-shadow:
    0 10px 30px var(--shadow),
    inset 0 0 0 5px rgba(255,255,255,.35),
    inset 0 0 0 7px rgba(205,164,81,.20);
  backdrop-filter: blur(1.5px);
}

.score-frame::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid rgba(199,157,73,.62);
  pointer-events: none;
}

.score-frame::after {
  content: "✦";
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 26px;
  height: 22px;
  display: grid;
  place-items: center;
  background: rgba(255,250,243,.9);
  color: var(--gold);
  font-size: 15px;
}

.corner {
  position: absolute;
  width: 27px;
  height: 27px;
  border-color: var(--gold);
  opacity: .9;
  z-index: 2;
}
.corner.tl { top: -2px; left: -2px; border-top: 2px solid; border-left: 2px solid; }
.corner.tr { top: -2px; right: -2px; border-top: 2px solid; border-right: 2px solid; }
.corner.bl { bottom: -2px; left: -2px; border-bottom: 2px solid; border-left: 2px solid; }
.corner.br { bottom: -2px; right: -2px; border-bottom: 2px solid; border-right: 2px solid; }

.countdown {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.unit {
  position: relative;
  min-height: 92px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 4px;
  border: 1px solid rgba(199,157,73,.65);
  background:
    linear-gradient(145deg, rgba(255,255,255,.48), rgba(250,237,216,.12));
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.22),
    0 3px 10px rgba(124,91,55,.09);
  clip-path: polygon(
    8px 0, calc(100% - 8px) 0, 100% 8px,
    100% calc(100% - 8px), calc(100% - 8px) 100%,
    8px 100%, 0 calc(100% - 8px), 0 8px
  );
}

.unit::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px dotted rgba(194,150,66,.42);
  pointer-events: none;
}

.number {
  color: var(--blush);
  font-family: "DM Serif Display", Georgia, serif;
  font-size: clamp(43px, 12vw, 72px);
  line-height: .9;
  letter-spacing: .015em;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 5px rgba(255,255,255,.75);
}

.label {
  margin-top: 7px;
  color: var(--gold);
  text-transform: uppercase;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .27em;
}

.bottom-note {
  margin: 18px 0 0;
  font-size: 12px;
  letter-spacing: .12em;
  color: rgba(142,102,112,.9);
}

.sparkle {
  color: var(--gold);
  padding: 0 6px;
}

@media (min-width: 560px) {
  .page { padding-left: 28px; padding-right: 28px; }
  .seal { width: 104px; height: 104px; }
  .monogram { font-size: 42px; }
  .countdown { grid-template-columns: repeat(4, 1fr); gap: 13px; }
  .unit { min-height: 128px; }
  .number { font-size: 58px; }
  .score-frame { padding: 23px 18px 19px; }
}

@media (prefers-reduced-motion: reduce) {
  .glow { animation: none; }
}
</style>
</head>

<body>
<main class="page" aria-label="Sidak and Alam wedding countdown">
  <span class="glow g1"></span><span class="glow g2"></span>
  <span class="glow g3"></span><span class="glow g4"></span>
  <span class="glow g5"></span><span class="glow g6"></span>
  <span class="glow g7"></span><span class="glow g8"></span>

  <section class="content">
    <div class="seal" aria-label="Sidak and Alam monogram">
      <div class="monogram">S<span style="font-size:.62em">·</span>A</div>
    </div>

    <p class="kicker">the wedding of</p>

    <h1 class="names">Sidak <span class="amp">&amp;</span> Alam</h1>

    <div class="until">Until forever</div>

    <div class="date" aria-label="November 11, 2027">11 · 11 · 27</div>

    <div class="score-frame">
      <i class="corner tl"></i><i class="corner tr"></i>
      <i class="corner bl"></i><i class="corner br"></i>

      <div class="countdown" aria-live="polite">
        <div class="unit">
          <div class="number" id="days">000</div>
          <div class="label">Days</div>
        </div>
        <div class="unit">
          <div class="number" id="hours">00</div>
          <div class="label">Hours</div>
        </div>
        <div class="unit">
          <div class="number" id="minutes">00</div>
          <div class="label">Minutes</div>
        </div>
        <div class="unit">
          <div class="number" id="seconds">00</div>
          <div class="label">Seconds</div>
        </div>
      </div>
    </div>

    <p class="bottom-note">
      <span class="sparkle">✦</span>
      counting every little moment
      <span class="sparkle">✦</span>
    </p>
  </section>
</main>

<script>
(() => {
  // November 11, 2027 at midnight in the viewer's local time.
  // The countdown automatically updates every second.
  const target = new Date(2027, 10, 11, 0, 0, 0);

  const daysEl = document.getElementById("days");
  const hoursEl = document.getElementById("hours");
  const minutesEl = document.getElementById("minutes");
  const secondsEl = document.getElementById("seconds");

  const pad = (n) => String(n).padStart(2, "0");

  function updateCountdown() {
    const now = new Date();
    let diff = target.getTime() - now.getTime();

    if (diff <= 0) {
      daysEl.textContent = "000";
      hoursEl.textContent = "00";
      minutesEl.textContent = "00";
      secondsEl.textContent = "00";
      document.querySelector(".until").textContent = "Forever starts now";
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    daysEl.textContent = String(days).padStart(3, "0");
    hoursEl.textContent = pad(hours);
    minutesEl.textContent = pad(minutes);
    secondsEl.textContent = pad(seconds);
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
})();
</script>
</body>
</html>
